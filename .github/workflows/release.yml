name: Publish HACS release
on:
  push:
    branches: ['release/v0.1.5']
    tags:
      - 'v[0-9]*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the tagged integration
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.5
        run: |
          set -eu
          version=$(gh api --method GET "repos/$GITHUB_REPOSITORY/contents/custom_components/tapo_cloud_c200/manifest.json" -f ref="$TAG" --jq .content | base64 --decode | jq -er .version)
          test "$TAG" = "v$version"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
          notes=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq .message)
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="$TAG" -f body="$notes"
